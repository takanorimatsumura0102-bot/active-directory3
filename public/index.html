<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AD ログイン</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <section id="login-section" class="panel">
        <h1>ログイン</h1>
        <p class="hint">Active Directory のユーザー名とパスワードを入力してください。</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="username">ユーザー名</label>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p id="error-message" class="error" hidden></p>
          <button type="submit" id="submit-btn">ログイン</button>
        </form>
      </section>

      <section id="hello-section" class="panel" hidden>
        <h1>hello</h1>
        <p id="hello-user-line" class="hello-user-line">ユーザー名: <span id="hello-username"></span></p>
        <p id="hello-name-line" class="hello-name-line">氏名: <span id="hello-display-name"></span></p>
        <button type="button" id="logout-btn" class="secondary">戻る</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
